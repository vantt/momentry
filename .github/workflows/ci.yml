# Tests, packaging and the install/update/uninstall lifecycle on Linux, macOS and Windows.
# Also called by release.yml before anything is published.
# Push and PR run the lite matrix (Linux on every Node, Windows on one); a tag or a manual run adds macOS
# and the rest of Windows. macOS bills 10x and Windows 2x in a private repo.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'plans/**', 'website/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'plans/**', 'website/**']
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '[{"os":"ubuntu-24.04","node":"20"},{"os":"ubuntu-24.04","node":"22"},{"os":"ubuntu-24.04","node":"24"},{"os":"windows-2025","node":"20"},{"os":"windows-2025","node":"22"},{"os":"windows-2025","node":"24"},{"os":"macos-15","node":"20"},{"os":"macos-15","node":"22"},{"os":"macos-15","node":"24"}]' || '[{"os":"ubuntu-24.04","node":"20"},{"os":"ubuntu-24.04","node":"22"},{"os":"ubuntu-24.04","node":"24"},{"os":"windows-2025","node":"22"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: unit and integration tests
        shell: bash
        run: node --test test/*.test.mjs
      - name: package (dry run)
        run: node scripts/package-release.mjs --dry-run
      - name: installer lifecycle (sh)
        if: runner.os != 'Windows'
        run: sh scripts/test-installer.sh
      - name: agent-native loop
        if: runner.os != 'Windows'
        run: sh scripts/test-agent-native.sh
      - name: installer lifecycle (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-installer.ps1
