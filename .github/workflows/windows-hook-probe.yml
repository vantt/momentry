# Manual probe: on a real Windows runner, do Claude Code, Codex, pi and omp invoke momentry's hook?
# No credentials are used: the CLI sessions fail to authenticate, but SessionStart-type hooks fire before that.
name: windows-hook-probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: install Claude Code and Codex CLIs
        shell: powershell
        run: |
          npm install -g bun @anthropic-ai/claude-code @openai/codex @earendil-works/pi-coding-agent @oh-my-pi/pi-coding-agent   # omp runs on Bun
          claude --version
          codex --version
          pi --version
          omp --version
      - name: install momentry from this commit and init a repo
        shell: powershell
        run: |
          node scripts/package-release.mjs --out rel
          $env:MOMENTRY_RELEASE_BASE = (Resolve-Path rel).Path
          $env:MOMENTRY_ALLOW_ROOT = '1'
          powershell -NoProfile -ExecutionPolicy Bypass -File rel/install.ps1
          $bin = Join-Path $env:LOCALAPPDATA 'momentry\bin\momentry.cmd'
          New-Item -ItemType Directory -Path probe-repo | Out-Null
          Set-Location probe-repo
          git init -q
          & $bin config privacy-add 'Probe Name'
          foreach ($d in '.pi\agent', '.omp\agent') { New-Item -ItemType Directory -Path (Join-Path $env:USERPROFILE $d) -Force | Out-Null }
          & $bin init --yes
          Get-Content (Join-Path $env:USERPROFILE '.claude\settings.json')
      - name: open a Claude Code session (no credentials)
        shell: powershell
        working-directory: probe-repo
        run: |
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','claude -p "hello" > claude.out 2>&1' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(90000)) { $p.Kill() }
          Get-Content claude.out -ErrorAction SilentlyContinue | Select-Object -First 20
          Start-Sleep -Seconds 5
      - name: open a Codex session (local dead provider, no network; hook trust bypassed as CI cannot approve it)
        shell: powershell
        working-directory: probe-repo
        run: |
          $codexHome = Join-Path $env:USERPROFILE '.codex'
          New-Item -ItemType Directory -Path $codexHome -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $codexHome 'config.toml') -Encoding ASCII -Value @(
            'model_provider = "local"', 'model = "gpt-5"', '[model_providers.local]', 'name = "local"', 'base_url = "http://127.0.0.1:9/v1"', 'wire_api = "responses"')
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','codex exec --dangerously-bypass-hook-trust "hello" > codex.out 2>&1' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(90000)) { $p.Kill() }
          Get-Content codex.out -ErrorAction SilentlyContinue | Select-String 'hook:|failed to parse'
          Start-Sleep -Seconds 5
      - name: open pi and omp sessions (pi without credentials; omp with a local dead provider, no network)
        shell: powershell
        working-directory: probe-repo
        run: |
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','pi -p "hello" > pi.out 2>&1' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(90000)) { $p.Kill() }
          Get-Content pi.out -ErrorAction SilentlyContinue | Select-Object -Last 3
          $models = @('providers:', '   local:', '      baseUrl: http://127.0.0.1:9/v1', '      apiKey: LOCAL_DEAD_KEY', '      api: openai-completions', '      models:', '         - id: dead', '           name: Dead local model', '           api: openai-completions', '           reasoning: false', '           input: [text]', '           contextWindow: 8000', '           maxTokens: 512')
          [IO.File]::WriteAllLines((Join-Path $env:USERPROFILE '.omp\agent\models.yml'), $models)
          $env:LOCAL_DEAD_KEY = 'x'
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','omp -p --model local/dead "hello" > omp.out 2>&1' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) { $p.Kill() }
          Get-Content omp.out -ErrorAction SilentlyContinue | Select-Object -Last 3
          Start-Sleep -Seconds 8
      - name: report hook.log
        shell: powershell
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'momentry\cache\hook.log'
          if (Test-Path $log) { Get-Content $log } else { Write-Host 'NO hook.log' }
          $text = if (Test-Path $log) { Get-Content -Raw $log } else { '' }
          $fail = $false
          if ($text -notmatch '"event":"hook\.spawned","runtime":"claude"') { Write-Host '::error::Claude Code did not invoke the momentry hook'; $fail = $true }
          if ($text -notmatch '"event":"hook\.spawned","runtime":"codex"') { Write-Host '::error::Codex did not invoke the momentry hook'; $fail = $true }
          if ($text -notmatch '"event":"hook\.spawned","runtime":"pi"') { Write-Host '::error::pi did not invoke the momentry hook'; $fail = $true }
          if ($text -notmatch '"event":"hook\.spawned","runtime":"omp"') { Write-Host '::error::omp did not invoke the momentry hook'; $fail = $true }
          if ($fail) { exit 1 }
