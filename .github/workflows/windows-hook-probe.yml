# Manual probe for issue #1: on a real Windows runner, does Claude Code (and Codex) invoke momentry's hook?
# No credentials are used: the CLI sessions fail to authenticate, but SessionStart-type hooks fire before that.
name: windows-hook-probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: install Claude Code and Codex CLIs
        shell: powershell
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex
          claude --version
          codex --version
      - name: install momentry from this commit and init a repo
        shell: powershell
        run: |
          node scripts/package-release.mjs --out rel
          $env:MOMENTRY_RELEASE_BASE = (Resolve-Path rel).Path
          $env:MOMENTRY_ALLOW_ROOT = '1'
          powershell -NoProfile -ExecutionPolicy Bypass -File rel/install.ps1
          $bin = Join-Path $env:LOCALAPPDATA 'momentry\bin\momentry.cmd'
          New-Item -ItemType Directory -Path probe-repo | Out-Null
          Set-Location probe-repo
          git init -q
          & $bin config privacy-add 'Probe Name'
          & $bin init --yes
          Get-Content (Join-Path $env:USERPROFILE '.claude\settings.json')
      - name: open a Claude Code session (no credentials)
        shell: powershell
        working-directory: probe-repo
        run: |
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','claude -p "hello" > claude.out 2>&1' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(90000)) { $p.Kill() }
          Get-Content claude.out -ErrorAction SilentlyContinue | Select-Object -First 20
          Start-Sleep -Seconds 5
      - name: open a Codex session (local dead provider, no network; hook trust bypassed as CI cannot approve it)
        shell: powershell
        working-directory: probe-repo
        run: |
          $codexHome = Join-Path $env:USERPROFILE '.codex'
          New-Item -ItemType Directory -Path $codexHome -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $codexHome 'config.toml') -Encoding ASCII -Value @(
            'model_provider = "local"', 'model = "gpt-5"', '[model_providers.local]', 'name = "local"', 'base_url = "http://127.0.0.1:9/v1"', 'wire_api = "responses"')
          # diagnostic hook next to momentry's: what environment does Codex give a hook on Windows?
          $hj = Join-Path $codexHome 'hooks.json'
          $j = Get-Content -Raw $hj | ConvertFrom-Json
          $diag = 'cmd /d /c "(echo PATH=%PATH%& echo LOCALAPPDATA=%LOCALAPPDATA%& echo USERPROFILE=%USERPROFILE%& where node& echo where=%ERRORLEVEL%& (echo x>"%LOCALAPPDATA%\momentry\cache\probe-write.txt" && echo cachewrite=ok || echo cachewrite=fail)) > "%CD%\codex-hook-diag.txt" 2>&1"'
          $j.hooks.SessionStart += [pscustomobject]@{ hooks = @([pscustomobject]@{ type = 'command'; command = $diag }) }
          [IO.File]::WriteAllText($hj, ($j | ConvertTo-Json -Depth 10), (New-Object Text.UTF8Encoding $false))  # no BOM: Codex rejects it
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','codex exec --json --dangerously-bypass-hook-trust "hello" > codex-json.out 2>&1' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(90000)) { $p.Kill() }
          Write-Host '=== hook events from codex exec --json'
          Get-Content codex-json.out -ErrorAction SilentlyContinue | Select-String -Pattern 'hook' | ForEach-Object { $_.Line.Substring(0, [Math]::Min(900, $_.Line.Length)) }
          foreach ($sb in 'read-only', 'danger-full-access') {
            Write-Host "=== codex exec --sandbox $sb"
            $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c',"codex exec --sandbox $sb --dangerously-bypass-hook-trust `"hello`" > codex-$sb.out 2>&1" -PassThru -NoNewWindow
            if (-not $p.WaitForExit(90000)) { $p.Kill() }
            Get-Content "codex-$sb.out" -ErrorAction SilentlyContinue | Select-String 'hook:|failed to parse'
            Start-Sleep -Seconds 5
            Write-Host "--- diag after ${sb}:"; Get-Content codex-hook-diag.txt -ErrorAction SilentlyContinue; Remove-Item codex-hook-diag.txt -ErrorAction SilentlyContinue
            $log = Join-Path $env:LOCALAPPDATA 'momentry\cache\hook.log'
            Write-Host "--- codex lines in hook.log after ${sb}:"; if (Test-Path $log) { Select-String -LiteralPath $log -Pattern '"runtime":"codex"' | ForEach-Object { $_.Line } }
          }
      - name: diagnose the Codex hook (rollout hook results, same command through cmd /C)
        shell: powershell
        working-directory: probe-repo
        continue-on-error: true
        run: |
          $roll = Get-ChildItem -Recurse -Filter 'rollout-*.jsonl' (Join-Path $env:USERPROFILE '.codex\sessions') -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($roll) { Select-String -LiteralPath $roll.FullName -Pattern 'hook' | ForEach-Object { $_.Line.Substring(0, [Math]::Min(600, $_.Line.Length)) } }
          $cmdline = (Get-Content -Raw (Join-Path $env:USERPROFILE '.codex\hooks.json') | ConvertFrom-Json).hooks.SessionStart[0].hooks[0].command
          Write-Host "command: $cmdline"
          '{"session_id":"x","cwd":"' + ((Get-Location).Path -replace '\\','\\') + '"}' | cmd.exe /C "`"$cmdline`""
          Write-Host "cmd /C exit: $LASTEXITCODE"
          Write-Host '--- environment Codex gave the diagnostic hook:'
          Get-Content (Join-Path $env:TEMP 'codex-hook-diag.txt') -ErrorAction SilentlyContinue
      - name: report hook.log
        shell: powershell
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'momentry\cache\hook.log'
          if (Test-Path $log) { Get-Content $log } else { Write-Host 'NO hook.log' }
          $text = if (Test-Path $log) { Get-Content -Raw $log } else { '' }
          $fail = $false
          if ($text -notmatch '"event":"hook\.spawned","runtime":"claude"') { Write-Host '::error::Claude Code did not invoke the momentry hook'; $fail = $true }
          if ($text -notmatch '"event":"hook\.spawned","runtime":"codex"') { Write-Host '::error::Codex did not invoke the momentry hook'; $fail = $true }
          if ($fail) { exit 1 }
