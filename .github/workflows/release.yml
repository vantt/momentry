# Release on a version tag: full CI, tag == lib/version.mjs, package, draft release, smoke-install the draft
# on every OS through a local copy of its assets, then publish. A failing smoke test leaves only a draft.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  draft:
    needs: ci
    runs-on: ${{ contains(vars.MOMENTRY_SELF_HOSTED, 'linux') && fromJSON('["self-hosted","linux"]') || 'ubuntu-24.04' }}
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: isolate HOME on a self-hosted runner (Unix)
        if: runner.environment == 'self-hosted' && runner.os != 'Windows'
        shell: bash
        run: |
          h="$RUNNER_TEMP/home"; rm -rf "$h"; mkdir -p "$h/.npm-global/bin"
          printf '%s\n' "HOME=$h" "XDG_CONFIG_HOME=$h/.config" "XDG_CACHE_HOME=$h/.cache" "XDG_DATA_HOME=$h/.local/share" \
            "npm_config_prefix=$h/.npm-global" "MOMENTRY_NO_MODIFY_PATH=1" >> "$GITHUB_ENV"
          echo "$h/.npm-global/bin" >> "$GITHUB_PATH"
      - name: isolate USERPROFILE on a self-hosted runner (Windows)
        if: runner.environment == 'self-hosted' && runner.os == 'Windows'
        shell: powershell
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'home'
          if (Test-Path $h) { Remove-Item -Recurse -Force $h }
          $npm = Join-Path $h 'npm-global'
          New-Item -ItemType Directory -Path $npm, (Join-Path $h 'AppData\Local'), (Join-Path $h 'AppData\Roaming') -Force | Out-Null
          @("HOME=$h", "USERPROFILE=$h", "LOCALAPPDATA=$h\AppData\Local", "APPDATA=$h\AppData\Roaming", "npm_config_prefix=$npm", 'MOMENTRY_NO_MODIFY_PATH=1') |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $npm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - id: v
        name: tag must equal lib/version.mjs
        run: |
          want="v$(node -p "require('fs').readFileSync('lib/version.mjs','utf8').match(/VERSION = '([^']+)'/)[1]")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != $want (lib/version.mjs)"; exit 1; }
          echo "tag=$want" >> "$GITHUB_OUTPUT"
      - name: package
        run: node scripts/package-release.mjs --out out
      - name: verify assets
        run: |
          cd out && sha256sum -c checksums.txt
          [ "$(wc -l < checksums.txt)" = 3 ] || { echo "expected 3 assets"; exit 1; }
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft $pre --title "momentry $GITHUB_REF_NAME" --notes-file notes.md out/*

  smoke:
    needs: draft
    name: smoke (${{ matrix.os }})
    runs-on: ${{ contains(vars.MOMENTRY_SELF_HOSTED, matrix.label) && fromJSON(format('["self-hosted","{0}"]', matrix.label)) || matrix.os }}
    permissions:
      contents: write   # draft releases are only visible to tokens with push access; this job only downloads
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: linux }
          - { os: windows-2025, label: windows }
          # macOS is off for now:
          # - { os: macos-15, label: macos }
    steps:
      - name: isolate HOME on a self-hosted runner (Unix)
        if: runner.environment == 'self-hosted' && runner.os != 'Windows'
        shell: bash
        run: |
          h="$RUNNER_TEMP/home"; rm -rf "$h"; mkdir -p "$h/.npm-global/bin"
          printf '%s\n' "HOME=$h" "XDG_CONFIG_HOME=$h/.config" "XDG_CACHE_HOME=$h/.cache" "XDG_DATA_HOME=$h/.local/share" \
            "npm_config_prefix=$h/.npm-global" "MOMENTRY_NO_MODIFY_PATH=1" >> "$GITHUB_ENV"
          echo "$h/.npm-global/bin" >> "$GITHUB_PATH"
      - name: isolate USERPROFILE on a self-hosted runner (Windows)
        if: runner.environment == 'self-hosted' && runner.os == 'Windows'
        shell: powershell
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'home'
          if (Test-Path $h) { Remove-Item -Recurse -Force $h }
          $npm = Join-Path $h 'npm-global'
          New-Item -ItemType Directory -Path $npm, (Join-Path $h 'AppData\Local'), (Join-Path $h 'AppData\Roaming') -Force | Out-Null
          @("HOME=$h", "USERPROFILE=$h", "LOCALAPPDATA=$h\AppData\Local", "APPDATA=$h\AppData\Roaming", "npm_config_prefix=$npm", 'MOMENTRY_NO_MODIFY_PATH=1') |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $npm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: download the draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ needs.draft.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --dir rel
      - name: install from the draft (sh)
        if: runner.os != 'Windows'
        run: |
          sh rel/install.sh --local-fixture rel --yes
          bash -l -c "$HOME/.local/bin/momentry --version" | grep -qx "momentry ${GITHUB_REF_NAME#v}"
          "$HOME/.local/bin/momentry" doctor --json > doctor.json || true
          node -e "const j=JSON.parse(require('fs').readFileSync('doctor.json','utf8')); if (j.schema !== 1) process.exit(1)"
          "$HOME/.local/bin/momentry" uninstall --yes
          [ ! -e "$HOME/.local/bin/momentry" ]
      - name: install from the draft (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:MOMENTRY_RELEASE_BASE = (Resolve-Path rel).Path
          $env:MOMENTRY_NO_MODIFY_PATH = '1'
          if ($env:RUNNER_ENVIRONMENT -ne 'self-hosted') { $env:MOMENTRY_ALLOW_ROOT = '1' }   # GitHub's Windows runners run as Administrator
          powershell -NoProfile -ExecutionPolicy Bypass -File rel/install.ps1
          $bin = Join-Path $env:LOCALAPPDATA 'momentry\bin\momentry.cmd'
          if ((& $bin --version) -ne "momentry $($env:GITHUB_REF_NAME.Substring(1))") { exit 1 }
          & $bin uninstall --yes
          if ($LASTEXITCODE -ne 0) { exit 1 }

  publish:
    needs: [draft, smoke]
    runs-on: ${{ contains(vars.MOMENTRY_SELF_HOSTED, 'linux') && fromJSON('["self-hosted","linux"]') || 'ubuntu-24.04' }}
    permissions:
      contents: write
    steps:
      - name: publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="--latest"; case "${{ needs.draft.outputs.tag }}" in *-*) latest="--latest=false" ;; esac
          gh release edit "${{ needs.draft.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false $latest
