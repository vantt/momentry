<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt nhãn</title>
<style>
:root {
  --bg: oklch(0.985 0.004 85); --panel: oklch(1 0 0); --line: oklch(0.9 0.006 85); --text: oklch(0.24 0.01 85);
  --muted: oklch(0.52 0.01 85); --accent: oklch(0.55 0.15 35); --accent-soft: oklch(0.95 0.03 35);
  --ok: oklch(0.52 0.12 150); --ok-soft: oklch(0.95 0.04 150); --warn: oklch(0.62 0.13 75); --bad: oklch(0.55 0.17 25);
  --r: 8px; --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: oklch(0.2 0.006 85); --panel: oklch(0.24 0.006 85); --line: oklch(0.33 0.008 85); --text: oklch(0.93 0.006 85);
    --muted: oklch(0.7 0.01 85); --accent: oklch(0.72 0.14 40); --accent-soft: oklch(0.32 0.05 40); --ok: oklch(0.75 0.13 150); --ok-soft: oklch(0.3 0.05 150); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
.app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
nav { border-right: 1px solid var(--line); padding: 20px 12px; position: sticky; top: 0; height: 100vh; overflow: auto; }
nav h1 { font-size: 15px; margin: 0 8px 4px; }
nav p { margin: 0 8px 16px; color: var(--muted); font-size: 13px; }
nav button { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 8px 10px; border-radius: var(--r); cursor: pointer; }
nav button:hover { background: var(--accent-soft); }
nav button[aria-current="true"] { background: var(--accent-soft); font-weight: 600; }
nav .sub { display: flex; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 400; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); }
.pill.done { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
main { padding: 24px 32px 120px; max-width: 1100px; }
.head h2 { margin: 0; font-size: 22px; }
.head .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
.help { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; margin: 16px 0 20px; font-size: 14px; color: var(--muted); }
.help b { color: var(--text); }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 28px 0 8px; }
.row { display: grid; grid-template-columns: 56px 1fr 92px 36px; gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 8px; }
.row.is-t { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.tbox { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); cursor: pointer; user-select: none; }
.tbox input { width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; margin: 2px 0 0; }
.fields input { width: 100%; font: inherit; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; }
.fields input:hover { border-color: var(--line); }
.fields input:focus { outline: none; border-color: var(--accent); background: var(--bg); }
.fields .title { font-weight: 600; font-size: 15px; }
.fields .small { font-size: 13px; color: var(--muted); }
.fields .why { font-size: 13px; color: var(--muted); padding: 0 6px; }
.fields label { display: grid; grid-template-columns: 72px 1fr; align-items: center; font-size: 12px; color: var(--muted); }
.rank { font-size: 12px; text-align: right; color: var(--muted); padding-top: 4px; }
.rank b { display: block; font-size: 18px; color: var(--text); }
.rank.miss b { color: var(--bad); font-size: 13px; }
.del { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; border-radius: 6px; width: 32px; height: 32px; }
.del:hover { color: var(--bad); background: var(--accent-soft); }
.found { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.found li { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
.found li:first-child { border-top: 0; }
.found ul { list-style: none; margin: 0; padding: 0; }
.found .n { color: var(--muted); font-size: 12px; width: 24px; text-align: right; flex: none; }
.found .t { flex: 1; }
.found .code { color: var(--muted); font: 12px ui-monospace, Menlo, Consolas, monospace; flex: none; }
.found .m { font-size: 12px; color: var(--ok); flex: none; }
.angle { font-size: 13px; color: var(--text); border-left: 2px solid var(--accent); padding: 2px 0 2px 8px; margin: 4px 0 2px; }
.angle .aud { display: block; color: var(--muted); font-size: 12px; }
.angle.none { color: var(--muted); border-left-color: var(--line); font-style: italic; }
.fields .angle { margin: 4px 6px; }
.verdict { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.verdict button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel); color: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer; }
.verdict button:hover { border-color: var(--accent); }
.verdict button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.verdict button[data-v="invented"][aria-pressed="true"] { border-color: var(--bad); color: var(--bad); }
.verdict button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.verdict .q { font-size: 12px; color: var(--muted); align-self: center; margin-right: 2px; }
.verdict + .verdict { margin-top: 4px; }
.versus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 2px; }
.versus .angle { margin: 0; }
.versus .angle.old { border-left-color: var(--line); color: var(--muted); }
.versus .tag, .spine .tag { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.spine { margin: 6px 0 2px; font-size: 12px; display: grid; grid-template-columns: 110px 1fr; gap: 2px 10px; }
.spine dt { color: var(--muted); }
.spine dd { margin: 0; }
.spine dd.empty { color: var(--muted); font-style: italic; }
.spine .ln { color: var(--muted); font-size: 11px; }
@media (max-width: 760px) { .versus { grid-template-columns: 1fr; } .spine { grid-template-columns: 1fr; } }
.btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: inherit; padding: 7px 14px; border-radius: var(--r); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.small { font-size: 12px; padding: 3px 10px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn:focus-visible, nav button:focus-visible, .del:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { position: fixed; bottom: 0; left: 260px; right: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 32px; display: flex; gap: 12px; align-items: center; }
.bar .msg { flex: 1; font-size: 14px; color: var(--muted); }
.bar .msg.err { color: var(--bad); }
.add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.add input { font: inherit; border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px; background: var(--panel); color: inherit; }
.empty { color: var(--muted); padding: 12px; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; } nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px; }
  nav p { display: none; } #list { display: flex; gap: 6px; overflow-x: auto; } #list button { flex: none; width: 200px; }
  main { padding: 16px; } .bar { left: 0; padding: 12px 16px; } .row { grid-template-columns: 44px 1fr 36px; } .rank { display: none; } .add { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <nav><h1>Duyệt nhãn</h1><p>Bộ đề chấm chuyện của momentry</p><div id="list"></div></nav>
  <main id="main"><p class="empty">Đang tải…</p></main>
</div>
<div class="bar"><span class="msg" id="msg"></span><button class="btn" id="save">Lưu nháp</button><button class="btn primary" id="done">Lưu và đánh dấu đã duyệt</button></div>
<script>
const key = (location.hash.match(/k=([\w-]+)/) || [])[1] || sessionStorage.getItem('k');
if (key) { sessionStorage.setItem('k', key); history.replaceState(null, '', location.pathname); }
const api = async (p, opt = {}) => {
  const r = await fetch(p, { ...opt, headers: { 'x-key': key || '', 'content-type': 'application/json' } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let sessions = [], cur = null, dirty = false;
const msg = (t, err) => { const m = document.getElementById('msg'); m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); };
const setDirty = (v) => { dirty = v; if (v) msg('Có thay đổi chưa lưu.'); };

async function loadList() {
  sessions = await api('/api/sessions');
  document.getElementById('list').innerHTML = sessions.map((s) => `
    <button data-id="${s.id}" aria-current="${cur && cur.id === s.id}">
      ${esc(s.id)} <span class="pill ${s.meta.status === 'reviewed' ? 'done' : ''}">${s.meta.status === 'reviewed' ? 'đã duyệt' : 'nháp'}</span>
      <span class="sub"><span>${esc(s.meta.domain || '')}</span></span>
      <span class="sub"><span>${s.count} chuyện · ${s.t} t</span><span>${esc(s.meta.host || '')} · ${esc(s.meta.language || '')}</span></span>
    </button>`).join('');
}

async function open(id) {
  if (dirty && !confirm('Bỏ thay đổi chưa lưu?')) return;
  cur = await api('/api/sessions/' + id);
  setDirty(false); msg('');
  render(); loadList();
}

function rankOf(r) {
  const name = r.slug || r.title;
  if (!(name in cur.ranks)) return '';
  const n = cur.ranks[name];
  return n == null ? '<div class="rank miss"><b>không thấy</b>momentry bỏ sót</div>' : `<div class="rank"><b>${n}</b>trên ${cur.total}</div>`;
}

function render() {
  const m = cur.meta;
  const rows = cur.rows.map((r, i) => `
    <div class="row ${r.t ? 'is-t' : ''}" data-i="${i}">
      <label class="tbox" title="Chuyện thật sự đáng kể"><input type="checkbox" data-f="t" ${r.t ? 'checked' : ''}>đáng kể</label>
      <div class="fields">
        <input class="title" data-f="title" value="${esc(r.title)}" aria-label="Tiêu đề">
        ${r.angle ? `<div class="angle" title="Góc kể của chuyện momentry tìm ra khớp với đáp án này">${esc(r.angle)}</div>` : ''}
        ${r.why ? `<div class="why">${esc(r.why)}</div>` : ''}
        <label>từ khoá<input class="small" data-f="keywords" value="${esc(r.keywords)}" placeholder="3–6 từ đặc trưng, cách nhau dấu phẩy"></label>
        <label>dòng<input class="small" data-f="lines" value="${esc(r.lines)}" placeholder="không bắt buộc"></label>
      </div>
      ${rankOf(r) || '<div></div>'}
      <button class="del" data-del="${i}" title="Không phải chuyện: xoá" aria-label="Xoá">×</button>
    </div>`).join('') || '<p class="empty">Chưa có đáp án.</p>';
  const found = cur.stories.length ? `<div class="found"><ul>${cur.stories.map((s, i) => `
      <li><span class="n">${i + 1}</span>${s.code ? `<span class="code">${esc(s.code)}</span>` : ''}<span class="t">${esc(s.title)}${angleHtml(s)}</span>${s.matched ? '<span class="m">đã có trong đáp án</span>' : `<button class="btn small" data-addstory="${i}">+ thêm làm đáp án</button>`}</li>`).join('')}</ul></div>` : '<p class="empty">Chưa có bản chụp cho phiên này.</p>';
  const angled = cur.stories.filter((s) => s.angle && s.angle !== 'none');
  const checked = angled.filter((s) => cur.angleChecks[s.id]).length;
  document.getElementById('main').innerHTML = `
    <div class="head"><h2>${esc(m.domain || cur.id)}</h2>
      <div class="meta">${esc(cur.id)} · ${esc(m.host)} · ${esc(m.language)} · dòng ${esc(m.window)} · ${m.status === 'reviewed' ? 'đã duyệt' : 'nháp'}</div></div>
    <div class="help">Với mỗi chuyện: <b>tick "đáng kể"</b> nếu bạn thật sự muốn kể nó; <b>bấm ×</b> nếu đó không phải chuyện. Sửa tiêu đề hay từ khoá nếu sai. Chuyện hay mà còn thiếu: thêm ở cuối trang, hoặc chọn từ danh sách momentry đã tìm ra. Xong thì bấm <b>Lưu và đánh dấu đã duyệt</b>.</div>
    <h3>Đáp án (${cur.rows.length})</h3>${rows}
    <h3>Thêm chuyện còn thiếu</h3>
    <form class="add" id="add"><input name="title" placeholder="Tiêu đề, ví dụ: test bằng điểm làm CI đỏ" required><input name="keywords" placeholder="Từ khoá, ví dụ: snapshot, bằng điểm, flaky" required><button class="btn">Thêm</button></form>
    <h3>Momentry tìm ra (${cur.stories.length})</h3>
    ${angled.length ? `<div class="help">Kiểm góc kể (${checked}/${angled.length} đã chấm): với mỗi chuyện có góc kể, chọn <b>kể được</b> nếu đó là chuyện bạn kể được, <b>không ra chuyện</b> nếu đúng nhưng không có gì để kể, <b>bịa</b> nếu có chi tiết không có trong phiên; rồi trả lời <b>Đọc xong hiểu được, không cần hỏi thêm?</b> (có / không). Có góc kể cũ thì hai bản đứng cạnh nhau. Lưu ngay khi bấm.</div>` : ''}${found}`;
}

const VERDICTS = [['tellable', 'kể được'], ['no-story', 'không ra chuyện'], ['invented', 'bịa']];
const ANSWERS = [['yes', 'có'], ['no', 'không']];
const SLOTS = [['context', 'Bối cảnh'], ['want', 'Muốn gì'], ['obstacle', 'Vướng gì'], ['turn', 'Tưởng… hoá ra'], ['action', 'Làm gì'], ['outcome', 'Giờ thì sao'], ['takeaway', 'Người nghe dùng được']];
const short = (refs) => (refs || []).map((r) => String(r).replace(/^.*#/, '')).join(', ');
function spineHtml(s) {
  if (!s.spine) return '';
  return `<dl class="spine" aria-label="Xương chuyện"><dt><span class="tag">xương chuyện</span></dt><dd>${s.completeness ?? 0}/7 ô</dd>${SLOTS.map(([k, w]) => {
    const v = s.spine[k];
    return `<dt>${w}</dt>${v ? `<dd>${esc(v.text)} <span class="ln">${esc(short(v.lines))}</span></dd>` : '<dd class="empty">trống</dd>'}`;
  }).join('')}</dl>`;
}
function oneAngle(text, audience, cls = '') {
  return `<div class="angle ${cls}">${esc(text)}${audience ? `<span class="aud">cho: ${esc(audience)}</span>` : ''}</div>`;
}
// a story with no angle yet (only the top of each session gets one at capture), or looked at with none: write it now
function writeBtn(s) {
  if (s.held || (s.angle && s.angle !== 'none')) return '';
  const busy = writing.has(s.id);
  return `<div class="verdict"><button type="button" data-write="${esc(s.id)}" ${busy ? 'disabled' : ''} title="Chạy momentry angle --story cho riêng chuyện này, model thật">${busy ? 'Đang viết… (khoảng 20 giây)' : s.angle ? 'Viết lại góc kể' : 'Viết góc kể'}</button><span class="q">~0,003–0,004 USD</span></div>`;
}
function angleHtml(s) {
  if (!s.angle) return writeBtn(s);
  const old = s.prevAngle ? (s.prevAngle === 'none' ? '<div class="angle none old">không có góc kể</div>' : oneAngle(s.prevAngle, s.prevAudience, 'old')) : '';
  const now = s.angle === 'none' ? '<div class="angle none">không có góc kể</div>' : oneAngle(s.angle, s.audience);
  const shown = old ? `<div class="versus"><div><span class="tag">góc kể cũ</span>${old}</div><div><span class="tag">góc kể mới</span>${now}</div></div>` : now;
  if (s.angle === 'none') return shown + spineHtml(s) + writeBtn(s);
  const v = cur.angleChecks[s.id];
  const u = (cur.understood || {})[s.id];
  return `${shown}${spineHtml(s)}
    <div class="verdict" role="group" aria-label="Kiểm góc kể">${VERDICTS.map(([k, w]) => `<button type="button" data-angle="${esc(s.id)}" data-v="${k}" aria-pressed="${v === k}">${w}</button>`).join('')}</div>
    <div class="verdict" role="group" aria-label="Đọc xong hiểu được, không cần hỏi thêm?"><span class="q">Đọc xong hiểu được, không cần hỏi thêm?</span>${ANSWERS.map(([k, w]) => `<button type="button" data-understood="${esc(s.id)}" data-v="${k}" aria-pressed="${u === k}">${w}</button>`).join('')}</div>`;
}

async function saveCheck(story, body, what) {
  try {
    const r = await api('/api/sessions/' + cur.id + '/angle', { method: 'PUT', body: JSON.stringify({ story, ...body }) });
    cur.angleChecks = r.angleChecks; cur.understood = r.understood; render(); msg(what);
  } catch (err) { msg('Không lưu được: ' + err.message, true); }
}
const writing = new Set();
async function writeAngle(story) {
  writing.add(story); render(); msg('Đang viết góc kể…');
  try {
    const r = await api('/api/sessions/' + cur.id + '/angle-run', { method: 'POST', body: JSON.stringify({ story }) });
    const s = cur.stories.find((x) => x.id === story);
    if (s) Object.assign(s, { angle: r.angle, audience: r.audience, spine: r.spine, completeness: r.completeness, prevAngle: null, prevAudience: null });
    msg(`${r.angle === 'none' ? 'Model xem rồi: không có góc kể.' : 'Đã viết góc kể.'}${r.usd != null ? ` Tốn ${r.usd.toFixed(4)} USD.` : ''}`);
  } catch (err) { msg('Không viết được góc kể: ' + err.message, true); }
  writing.delete(story); render();
}
const setVerdict = (story, verdict) => saveCheck(story, { verdict }, 'Đã lưu kiểm góc kể.');
const setUnderstood = (story, understood) => saveCheck(story, { understood }, 'Đã lưu câu trả lời.');

document.addEventListener('input', (e) => {
  const f = e.target.dataset.f; const row = e.target.closest('.row');
  if (!f || !row) return;
  const r = cur.rows[row.dataset.i];
  r[f] = f === 't' ? (e.target.checked ? 'x' : '') : e.target.value;
  if (f === 't') row.classList.toggle('is-t', !!r.t);
  setDirty(true);
});
document.addEventListener('click', (e) => {
  const w = e.target.closest('[data-write]');
  if (w) return writeAngle(w.dataset.write);
  const v = e.target.closest('[data-angle]');
  if (v) return setVerdict(v.dataset.angle, v.getAttribute('aria-pressed') === 'true' ? null : v.dataset.v);
  const q = e.target.closest('[data-understood]');
  if (q) return setUnderstood(q.dataset.understood, q.getAttribute('aria-pressed') === 'true' ? null : q.dataset.v);
  const b = e.target.closest('[data-id]'); if (b) return open(b.dataset.id);
  const d = e.target.closest('[data-del]'); if (d) { cur.rows.splice(Number(d.dataset.del), 1); setDirty(true); return render(); }
  const a = e.target.closest('[data-addstory]');
  if (a) { const s = cur.stories[a.dataset.addstory]; cur.rows.push({ slug: s.slug, title: s.title, lines: '', keywords: '', t: '', why: 'thêm từ danh sách momentry tìm ra', ...(s.angle && s.angle !== 'none' ? { angle: s.angle } : {}) }); s.matched = true; setDirty(true); render(); }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'add') return; e.preventDefault();
  const f = new FormData(e.target);
  cur.rows.push({ slug: '', title: f.get('title'), lines: '', keywords: f.get('keywords'), t: '', why: 'bạn thêm' });
  setDirty(true); render();
});
async function save(status) {
  if (!cur) return;
  try {
    await api('/api/sessions/' + cur.id, { method: 'PUT', body: JSON.stringify({ rows: cur.rows, status }) });
    cur.meta.status = status; setDirty(false); render(); await loadList();
    msg(status === 'reviewed' ? 'Đã lưu, phiên này đã duyệt.' : 'Đã lưu nháp.');
    if (status === 'reviewed') { const next = sessions.find((s) => s.meta.status !== 'reviewed'); if (next) setTimeout(() => open(next.id), 600); else msg('Đã duyệt hết. Báo Claude để chấm lại.'); }
  } catch (err) { msg('Không lưu được: ' + err.message, true); }
}
document.getElementById('save').onclick = () => save(cur?.meta.status === 'reviewed' ? 'reviewed' : 'draft');
document.getElementById('done').onclick = () => save('reviewed');
addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });
(async () => {
  if (!key) { document.getElementById('main').innerHTML = '<p class="empty">Thiếu khoá. Mở lại link in ra từ lệnh review.</p>'; return; }
  try { await loadList(); if (sessions[0]) open((sessions.find((s) => s.meta.status !== 'reviewed') || sessions[0]).id); }
  catch (err) { document.getElementById('main').innerHTML = `<p class="empty">${esc(err.message)}</p>`; }
})();
